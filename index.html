<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>RESOLVE-ONE — Consumer Dispute Resolution for India</title>
    <meta name="description" content="Sort it out. One step at a time. Plain-spoken, customer-controlled consumer dispute resolution for refunds, delivery, returns, and warranty problems in India." />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="RESOLVE-ONE — Consumer Dispute Resolution for India" />
    <meta property="og:description" content="Sort it out. One step at a time. Turn refund, delivery, and warranty disputes into verified proof packs in under 3 minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resolve.one" />
    <meta property="og:site_name" content="RESOLVE-ONE" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RESOLVE-ONE — Consumer Dispute Resolution for India" />
    <meta name="twitter:description" content="Customer-controlled consumer dispute resolution for India. Zero passwords, zero fake AI, 100% on-device IndexedDB." />

    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Self-hosted font preconnect and fallback webfonts for development/display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data: WebApplication & FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "RESOLVE-ONE",
          "url": "https://resolve.one",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "description": "Consumer dispute resolution web app for India. Plain-language proof pack builder and official grievance guide.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does RESOLVE-ONE contact the company or send emails on my behalf?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Never. RESOLVE-ONE operates with 100% customer approval at every step. We compile proof and format complaints, but you approve and send every message yourself."
              }
            },
            {
              "@type": "Question",
              "name": "Will RESOLVE-ONE ever ask for my passwords or banking OTPs?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Never. We have an unshakeable boundary against collecting passwords, OTPs, session cookies, CVVs, or banking PINs."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-surface-light-ground dark:bg-surface-dark-ground text-neutral-900 dark:text-neutral-100 antialiased min-h-screen selection:bg-brand-100 selection:text-brand-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
