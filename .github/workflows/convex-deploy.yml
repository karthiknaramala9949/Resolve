name: Deploy Convex Backend to Production

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/convex-deploy.yml'
  workflow_dispatch:

concurrency:
  group: convex-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and Deploy Convex Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies from lockfile
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Verify Convex Deploy Key Secret is Configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set in GitHub repository secrets. Add your Production Deploy Key under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy to Convex Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

